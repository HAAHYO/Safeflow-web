name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # package.json 의 packageManager 버전을 그대로 쓴다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # 필수 환경 변수가 빠진 빌드는 실패해야 한다(#11).
      - name: VITE_API_URL 없이 빌드하면 실패하는지 확인
        run: |
          if pnpm build; then
            echo "::error::VITE_API_URL 없이 빌드가 성공했습니다."
            exit 1
          fi
      - name: 빌드
        run: pnpm build
        env:
          VITE_API_URL: https://api.example.invalid
